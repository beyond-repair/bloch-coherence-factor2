[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bloch-factor2"
version = "0.1.1"
description = "Numerical falsification suite for the Bloch coherence factor-of-two stability bound."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
bloch-factor2 = "bloch_factor2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
name = "bloch-factor2"
version = "0.1.0"
description = "Numerical falsification suite for the Bloch coherence factor-of-two stability bound."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
